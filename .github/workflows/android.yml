name: Android APK

# 푸시 · PR 마다 테스트와 APK 빌드를 하고, v 로 시작하는 태그(예: v0.9.2)를 올리면
# 서명된 APK 를 GitHub Release 에 붙인다.
#
# 서명 키는 저장소에 없다. 저장소 Settings > Secrets and variables > Actions 에 아래 네 개를 넣으면
# 서명된 릴리즈 APK 가 나오고, 없으면 서명 안 된 APK 만 나온다(빌드는 성공). 자세한 방법은 docs/RELEASE.md.
#   HEALTH_KEYSTORE_BASE64  키스토어 파일(.jks)을 base64 한 줄로 바꾼 값
#   HEALTH_STORE_PASSWORD   키스토어 비밀번호
#   HEALTH_KEY_ALIAS        키 별칭
#   HEALTH_KEY_PASSWORD     키 비밀번호

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다. 태그(릴리즈)는 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Android SDK 는 GitHub 의 ubuntu 이미지에 이미 들어 있다(라이선스도 동의된 상태).
# 빠진 구성요소는 Gradle 이 알아서 내려받는다.
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: 단위 테스트 · 린트
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트와 린트
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: 리포트 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

  apk:
    name: APK 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 버전 읽기
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::app/build.gradle.kts 에서 versionName / versionCode 를 찾지 못했습니다."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "버전 $name ($code)"

      # 시크릿이 있을 때만 키스토어를 풀어 환경 변수로 넘긴다(app/build.gradle.kts 가 읽는다).
      # 포크에서 온 PR 은 시크릿이 비어 있어 서명 없이 빌드된다.
      - name: 서명 준비
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HEALTH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HEALTH_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEALTH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEALTH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/health-release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            {
              echo "HEALTH_STORE_FILE=$keystore"
              echo "HEALTH_STORE_PASSWORD=$STORE_PASSWORD"
              echo "HEALTH_KEY_ALIAS=$KEY_ALIAS"
              echo "HEALTH_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::서명 시크릿이 없어 릴리즈 APK 는 서명 없이 만들어집니다. 기기에 설치하려면 시크릿을 넣어 주세요(docs/RELEASE.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK 빌드
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: 서명 확인
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: 결과물 모으기
        run: |
          version="${{ steps.version.outputs.name }}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/health-${version}-debug.apk"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/health-${version}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/health-${version}-unsigned.apk"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: health-${{ steps.version.outputs.name }}-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 키스토어 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/health-release.jks"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 태그와 앱 버전이 같은지, 서명되었는지 확인
        run: |
          expected="v${{ needs.apk.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 앱 버전($expected)이 다릅니다. app/build.gradle.kts 의 versionName 을 확인하세요."
            exit 1
          fi
          if [ "${{ needs.apk.outputs.signed }}" != "true" ]; then
            echo "::error::서명 시크릿이 없어 서명된 APK 가 없습니다. 서명 안 된 APK 는 릴리즈에 올리지 않습니다."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: health-${{ needs.apk.outputs.version }}-apk
          path: out

      # 릴리즈에는 서명된 APK 한 개만 붙인다(디버그 APK 는 Actions 결과물에서 받는다).
      - uses: softprops/action-gh-release@v2
        with:
          files: out/health-${{ needs.apk.outputs.version }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
